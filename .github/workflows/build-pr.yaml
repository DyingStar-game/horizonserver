name: "Build PR (validation)"

on:
  pull_request:
    paths:
      - "scripts/install.sh"
      - "Horizon"
      - ".gitmodules"
      - "ds_*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "plugins.toml"
      - ".docker/**"

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      plugins: ${{ steps.filter.outputs.plugins }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'scripts/install.sh'
              - 'Horizon'
              - '.gitmodules'
              - '.docker/Dockerfile.server'
              - '.docker/entrypoint.sh'
              - '.docker/production_config.toml'
              - '.docker/plugins.toml'
            # Each filter mirrors the COPY instructions of its Dockerfile. If one
            # moves, the other must follow — otherwise a change ships to a registry
            # that never receives it (which is exactly what used to happen to the
            # ds_genericprops JSON files: they matched 'plugins', an image that
            # does not carry them).
            data:
              - 'ds_genericprops/props/**'
              - 'ds_genericprops/startup_items.json'
              - '.docker/Dockerfile.data'
            plugins:
              - 'ds_*/src/**'
              - 'ds_*/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'plugins.toml'
              - '.docker/Dockerfile.plugins'

  build-server:
    name: Build server image
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Horizon source
        run: scripts/install.sh

      - name: Check dependency sync with Horizon
        run: scripts/check_deps_sync.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.server
          push: false

  build-plugins:
    name: Build plugins image
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true' || needs.detect-changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Horizon source
        run: scripts/install.sh

      - name: Check dependency sync with Horizon
        run: scripts/check_deps_sync.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build plugins image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.plugins
          push: false

  build-data:
    name: Build data image
    needs: detect-changes
    if: needs.detect-changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    steps:
      # No submodules / install.sh / check_deps_sync.sh: Dockerfile.data is two
      # COPY instructions over ds_genericprops and touches neither Horizon/ nor
      # the Rust toolchain.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build data image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.data
          push: false
