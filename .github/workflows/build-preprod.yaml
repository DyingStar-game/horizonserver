name: "Build & Deploy to Preprod"

# Manual only: a merge into develop no longer builds. Each run from develop is
# a dev release: its version (<NEXT_VERSION>-dev.<UTC yyyymmddhhmm>) tags the
# built commit and cuts the [Unreleased] section of the changelog.
on:
  workflow_dispatch:
    inputs:
      build_server:
        description: "Build and push the horizon server image"
        type: boolean
        default: true
      build_plugins:
        description: "Build and push the horizon plugins image"
        type: boolean
        default: true
      build_data:
        description: "Build and push the horizon data image (ds_genericprops JSON)"
        type: boolean
        default: true

concurrency:
  group: preprod-deploy
  cancel-in-progress: false

env:
  HARBOR_REGISTRY: harbor.dyingstar-game.space
  SERVER_IMAGE: harbor.dyingstar-game.space/dyingstar/horizon
  PLUGINS_IMAGE: harbor.dyingstar-game.space/dyingstar/horizon-plugins
  DATA_IMAGE: harbor.dyingstar-game.space/dyingstar/horizon-data
  IMAGE_TAG: develop
  CHART_NAME: horizon

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compute dev version
        id: version
        env:
          # Next stable version, a repository variable raised at each release
          NEXT_VERSION: ${{ vars.NEXT_VERSION || '0.1.0' }}
        run: echo "version=${NEXT_VERSION}-dev.$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build-server:
    name: Build server image
    needs: version
    if: inputs.build_server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Horizon source
        run: scripts/install.sh

      - name: Check dependency sync with Horizon
        run: scripts/check_deps_sync.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.server
          push: true
          tags: ${{ env.SERVER_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.SERVER_IMAGE }}:buildcache-preprod
          cache-to: type=registry,ref=${{ env.SERVER_IMAGE }}:buildcache-preprod,mode=max

  build-plugins:
    name: Build plugins image
    needs: version
    if: inputs.build_server || inputs.build_plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Horizon source
        run: scripts/install.sh

      - name: Check dependency sync with Horizon
        run: scripts/check_deps_sync.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push plugins image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.plugins
          push: true
          tags: ${{ env.PLUGINS_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.PLUGINS_IMAGE }}:buildcache-preprod
          cache-to: type=registry,ref=${{ env.PLUGINS_IMAGE }}:buildcache-preprod,mode=max

  build-data:
    name: Build data image
    needs: version
    if: inputs.build_data
    runs-on: ubuntu-latest
    steps:
      # No submodules / install.sh / check_deps_sync.sh: Dockerfile.data is two
      # COPY instructions over ds_genericprops and touches neither Horizon/ nor
      # the Rust toolchain. No registry cache either — there is nothing to cache.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push data image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.data
          push: true
          tags: ${{ env.DATA_IMAGE }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Trigger preprod deployment
    needs: [build-server, build-plugins, build-data]
    if: >-
      always() &&
      (needs.build-server.result == 'success' ||
       needs.build-plugins.result == 'success' ||
       needs.build-data.result == 'success') &&
      needs.build-server.result != 'failure' &&
      needs.build-plugins.result != 'failure' &&
      needs.build-data.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger preprod deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.KUBERNETES_REPO_TOKEN }}
          repository: ${{ github.repository_owner }}/kubernetes
          event-type: deploy-preprod
          client-payload: '{"chart": "${{ env.CHART_NAME }}"}'

  dev-release:
    name: Dev release (tag + changelog)
    needs: [version, deploy]
    # A build from another branch reaches preprod but is not a dev release
    if: needs.deploy.result == 'success' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # No "v" prefix: v* tags start the production builds
          gh api --method POST "/repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/tags/$VERSION" -f "sha=${{ github.sha }}"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: DyingStar-game
          repositories: changelog

      - name: Send release dispatch to changelog repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/DyingStar-game/changelog/dispatches \
            --field event_type=release \
            --field "client_payload[component]=horizonserver" \
            --field "client_payload[version]=$VERSION" \
            --field "client_payload[date]=$(date -u +%Y-%m-%d)"
