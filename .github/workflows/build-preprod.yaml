name: "Build & Deploy to Preprod"

on:
  push:
    branches:
      - develop
    paths:
      - "scripts/install.sh"
      - "Horizon"
      - ".gitmodules"
      - "ds_*/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "plugins.toml"
      - ".docker/**"
  workflow_dispatch:
    inputs:
      build_server:
        description: "Build and push the horizon server image"
        type: boolean
        default: true
      build_plugins:
        description: "Build and push the horizon plugins image"
        type: boolean
        default: true

env:
  HARBOR_REGISTRY: harbor.dyingstar-game.space
  SERVER_IMAGE: harbor.dyingstar-game.space/dyingstar/horizon
  PLUGINS_IMAGE: harbor.dyingstar-game.space/dyingstar/horizon-plugins
  IMAGE_TAG: develop
  CHART_NAME: horizon

jobs:
  detect-changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.result.outputs.server }}
      plugins: ${{ steps.result.outputs.plugins }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            server:
              - 'scripts/install.sh'
              - 'Horizon'
              - '.gitmodules'
              - '.docker/Dockerfile.server'
              - '.docker/entrypoint.sh'
              - '.docker/production_config.toml'
              - '.docker/plugins.toml'
            plugins:
              - 'ds_*/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'plugins.toml'
              - '.docker/Dockerfile.plugins'

      - name: Resolve build targets
        id: result
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "server=${{ inputs.build_server }}" >> $GITHUB_OUTPUT
            echo "plugins=${{ inputs.build_plugins }}" >> $GITHUB_OUTPUT
          else
            echo "server=${{ steps.filter.outputs.server }}" >> $GITHUB_OUTPUT
            echo "plugins=${{ steps.filter.outputs.plugins }}" >> $GITHUB_OUTPUT
          fi

  build-server:
    name: Build server image
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Horizon source
        run: scripts/install.sh

      - name: Check dependency sync with Horizon
        run: scripts/check_deps_sync.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.server
          push: true
          tags: ${{ env.SERVER_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.SERVER_IMAGE }}:buildcache-preprod
          cache-to: type=registry,ref=${{ env.SERVER_IMAGE }}:buildcache-preprod,mode=max

  build-plugins:
    name: Build plugins image
    needs: detect-changes
    if: needs.detect-changes.outputs.server == 'true' || needs.detect-changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch Horizon source
        run: scripts/install.sh

      - name: Check dependency sync with Horizon
        run: scripts/check_deps_sync.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push plugins image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.plugins
          push: true
          tags: ${{ env.PLUGINS_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.PLUGINS_IMAGE }}:buildcache-preprod
          cache-to: type=registry,ref=${{ env.PLUGINS_IMAGE }}:buildcache-preprod,mode=max

  deploy:
    name: Trigger preprod deployment
    needs: [build-server, build-plugins]
    if: >-
      always() &&
      (needs.build-server.result == 'success' || needs.build-plugins.result == 'success') &&
      needs.build-server.result != 'failure' &&
      needs.build-plugins.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger preprod deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.KUBERNETES_REPO_TOKEN }}
          repository: ${{ github.repository_owner }}/kubernetes
          event-type: deploy-preprod
          client-payload: '{"chart": "${{ env.CHART_NAME }}"}'
