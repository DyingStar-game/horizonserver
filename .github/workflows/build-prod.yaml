name: Build Production Images

on:
  push:
    tags:
      - "v*"

env:
  HARBOR_REGISTRY: harbor.dyingstar-game.space
  SERVER_IMAGE: harbor.dyingstar-game.space/dyingstar/horizon
  PLUGINS_IMAGE: harbor.dyingstar-game.space/dyingstar/horizon-plugins

jobs:
  build-server:
    name: Build server image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tag name
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Fetch Horizon source
        run: scripts/install.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.SERVER_IMAGE }}:buildcache-prod
          cache-to: type=registry,ref=${{ env.SERVER_IMAGE }}:buildcache-prod,mode=max

  build-plugins:
    name: Build plugins image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tag name
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Fetch Horizon source
        run: scripts/install.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push plugins image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile.plugins
          push: true
          tags: |
            ${{ env.PLUGINS_IMAGE }}:${{ steps.tag.outputs.version }}
            ${{ env.PLUGINS_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.PLUGINS_IMAGE }}:buildcache-prod
          cache-to: type=registry,ref=${{ env.PLUGINS_IMAGE }}:buildcache-prod,mode=max
