[workspace]
resolver = "3"
members = ["ds_common",
    "ds_protocol",
    "ds_game_server", 
    "ds_player_authentication",
    "ds_genericprops",
    "ds_props",
    "ds_services",
    "ds_audio",
    "ds_bridge"
]

[workspace.dependencies]
# Event system (CLI will update this to horizon_event_system)
horizon_event_system = { path = "./Horizon/crates/horizon_event_system" }
horizon_protocol = { path = "./Horizon/crates/horizon_protocol" }
ds_protocol = { path = "./ds_protocol" }

# === Horizon deps copied from root Cargo.toml of Horizon ===
# === Async Runtime & Networking ===
async-trait = "0.1"
futures = "0.3"
horizon_sockets = { git = "https://github.com/Far-Beyond-Dev/Horizon-Sockets", rev = "50606e28a7a18f0b3dce783267266fb8c00a1232" }
luminal_rt = "0.4.1"
tokio = { version = "1.48", features = ["full"] }
tokio-tungstenite = "0.27.0"

# === CLI & Configuration ===
clap = { version = "4.0", features = ["derive"] }
toml = "0.8"

# === Concurrency & Performance ===
futures-util = "0.3"
crossbeam = "0.8"
dashmap = "6.1.0"
num_cpus = "1.13"
rayon = "1.7.0"

# === Data Processing & Encoding ===
uuid = { version = "1.18.1", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["raw_value"] }
bytes = "1"
# Exact pin, as in Horizon: bitcode only guarantees its format within a version.
bitcode = { version = "=0.6.9", features = ["serde"] }
lz4_flex = "0.11"
zstd = "0.13"
base64 = "0.22"
flate2 = "1.0"

# === Error Handling ===
anyhow = "1.0"
thiserror = "2.0.12"
bug = "0.2.0"

# === Logging & Tracing ===
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

# === Memory & Utilities ===
const_format = "0.2"
lazy_static = "1.4.0"
libc = "0.2"
once_cell = "1.19.0"

# === Platform & System ===
libloading = "0.8"
sysinfo = "0.36.1"

# === Testing & Development ===
tempfile = "3.5"

# === External Dependencies ===
ue_types = { git = "https://github.com/tristanpoland/UE5-rs", rev = "15df47693e314e4ca12fc97b8c8ed7b260fa6c8b" }
livekit = { version = "0.7", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.5", features = ["rustls-tls-native-roots"] }

# === Tokio metrics ===
# tokio-metrics = { version = "0.4.6", features = ["metrics-rs-integration"] }
metrics = "0.24"
# metrics-exporter-prometheus = { version = "0.18", features = ["uds-listener"] }
tokio-blocked = "*"
