[package]
name = "plugin_dyingstar_audio"
version = "0.1.0"
edition = "2021"
description = "Plugin for managing audio rooms and player participants (proximity, parties...)"
authors = ["David Durieux <david@durieux.family>"]
license = "MIT"
repository = "https://github.com/DyingStar-game/horizonserver"

[package.metadata]
documentation_url = "https://github.com/DyingStar-game/horizonserver/"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Event system (CLI will update this to horizon_event_system)
horizon_event_system = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"
tracing = { version = "0.1", features = ["log"] }
futures = { version = "0.3" }
tracing-subscriber = "0.3"
ds_common = { path = "../ds_common" }

# Optional: Additional commonly used dependencies
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

livekit = { workspace = true, features = ["rustls-tls-native-roots"] }
livekit-api = { workspace = true, features = ["rustls-tls-native-roots"] }
dashmap = "6"
anyhow = "1"

[dev-dependencies]
tokio-test = "0.4"
