[package]
name = "plugin_ds_player_authentication"
version = "0.1.0"
edition = "2021"
description = "Sample Horizon plugin demonstrating core functionality"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
repository = "https://github.com/Far-Beyond-Dev/your-plugin"

[package.metadata]
documentation_url = "https://github.com/DyingStar-game/horizonserver/"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Event system (CLI will update this to horizon_event_system)
horizon_event_system = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"
tracing = { version = "0.1", features = ["log"] }
# rustls + bundled Mozilla roots: the runtime image has no ca-certificates (JWKS fetch).
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls-webpki-roots"] }
futures = { version = "0.3" }
tracing-subscriber = "0.3"
ds_common = { path = "../ds_common" }
ds_protocol = { workspace = true }

# Optional: Additional commonly used dependencies
uuid = { version = "1.0", features = ["v4"] }
jsonwebtoken = "9"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
