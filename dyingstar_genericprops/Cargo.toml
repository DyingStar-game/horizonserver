[package]
name = "dyingstar_generic_props"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
horizon_event_system = { path = "../../Horizon/crates/horizon_event_system" }
luminal_rt = { git = "https://github.com/tristanpoland/Luminal", rev = "8c9870bca5d983ccefbc8ba00f4f7e6c7857d5da" }
tokio = { version = "1.46.1", features = ["full"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.12"
tracing = "0.1.41"
async-trait = "0.1"
dashmap = "6.1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }